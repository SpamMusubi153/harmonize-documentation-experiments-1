name: "DocChain1"
description: "Generate modern documentation using Doxygen, Sphinx, Breathe, and Fumadocs"
on:
  [push, workflow_dispatch]
env:
  DOXYFILE_PATH: "docs/Doxyfile"
  DOXYGEN_WORKING_DIRECTORY: "./"

jobs:
  generate_doxygen_documentation:
    runs-on: ubuntu-latest

    # Experimental Permissions of Test GitHub Pages Deployment
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # End Experimental Permissions
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate Doxygen Documentation
        uses: mattnotmitt/doxygen-action@v1.12
        with:
          doxyfile-path: ${{ env.DOXYFILE_PATH }}
          working-directory: ${{ env.DOXYGEN_WORKING_DIRECTORY }}
      - run: pwd && ls
      - name: Upload Generated XML
        uses: actions/upload-artifact@v4
        with:
          name: XML
          path: GeneratedDocumentation/xml
      - name: Upload Generated HTML
        uses: actions/upload-artifact@v4
        with:
          name: HTML
          path: GeneratedDocumentation/html
      - name: Test View
        run: cd GeneratedDocumentation/html && ls
      - name: Test Create Link-Free Output Version
        # run: sudo cp -r GeneratedDocumentation/html/ GeneratedDocumentation/Clean_html/ --no-preserve=links
        run: find GeneratedDocumentation/html -type l -delete
      - name: Test Upload Clean HTML
        uses: actions/upload-artifact@v4
        with:
          name: CleanHTML
          # path: GeneratedDocumentation/Clean_html
          path: GeneratedDocumentation/html
      # - run: cd GeneratedDocumentation && ls
      # - run: cd GeneratedDocumentation/xml && ls
      # - run: cd GeneratedDocumentation/html && ls
      - name: Test Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Test Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: CleanHTML

