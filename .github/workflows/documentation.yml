name: "DocChain1"
description: "Generate modern documentation using Doxygen, Sphinx, Breathe, and Fumadocs"
on:
  [push, workflow_dispatch]
env:
  DOXYFILE_PATH: "../docs/Doxyfile"
  DOXYGEN_WORKING_DIRECTORY: "./harmonize"

jobs:
  generate_doxygen_documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate Doxygen Documentation
        uses: mattnotmitt/doxygen-action@v1.12
        with:
          doxyfile-path: ${{ env.DOXYFILE_PATH }}
          working-directory: ${{ env.DOXYGEN_WORKING_DIRECTORY }}
      - run: ls
      - run: cd GeneratedDocumentation && ls
      - run: cd xml && ls