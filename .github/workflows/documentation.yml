name: "DocChain1"
description: "Generate modern documentation using Doxygen, Sphinx, Breathe, and Fumadocs"
on:
  [push, workflow_dispatch]
env:

  BUILDDIR: "./GeneratedDocumentation"

  DOXYFILE_PATH: "docs/Doxygen/Doxyfile"
  DOXYGEN_WORKING_DIRECTORY: "./"
  DOXYGEN_SOURCE_DIR: "harmonize/cpp"
  # TODO: Add configuration paramater to specify the folder path to document.

  SPHINXOPTS: ""
  # The Sphinx command to execute upon builds.
  SPHINXBUILD: sphinx-build
  SPHINX_PACKAGE_SETUP_COMMAND: ./install.sh
  # SPHINX_SOURCE_DIR: "harmonize/python"
  

jobs:
  generate_doxygen_documentation:
    runs-on: ubuntu-latest

    # Experimental Permissions of Test GitHub Pages Deployment
    # permissions:
    #   pages: write
    #   id-token: write
    # environment:
    #   name: github-pages
    #   url: ${{ steps.deployment.outputs.page_url }}
    # End Experimental Permissions

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Generate Doxygen Documentation
        uses: mattnotmitt/doxygen-action@v1.12
        with:
          doxyfile-path: ${{ env.DOXYFILE_PATH }}
          working-directory: ${{ env.DOXYGEN_WORKING_DIRECTORY }}
      - name: Upload Generated XML
        uses: actions/upload-artifact@v4
        with:
          name: DoxygenXML
          path: GeneratedDocumentation/xml
      - name: Upload Generated HTML
        uses: actions/upload-artifact@v4
        with:
          name: RawDoxygenHTML
          path: GeneratedDocumentation/html

      # - name: Test - Upload Generated HTML, formatted for GitHub Pages
      #   uses: actions/upload-pages-artifact@v3
      #   with:
      #     path: GeneratedDocumentation/html
      # # - name: Test Configure GitHub Pages
      # #   uses: actions/configure-pages@v5
      # - name: Test Deploy to GitHub Pages
      #   uses: actions/deploy-pages@v4
      #   id: deployment

  generate_sphinx_documentation:

    needs: generate_doxygen_documentation
    runs-on: ubuntu-latest

    # Experimental Permissions of Test GitHub Pages Deployment
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # End Experimental Permissions

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup a Workspace for Sphinx to Operate Within
        run: mkdir -p ${{ env.BUILDDIR }}/SphinxWorkspace
      - name: Copy in Configuration Files for Sphinx
        run: cp -r docs/Sphinx/* ${{ env.BUILDDIR }}/SphinxWorkspace/
      # - name: Copy in Source Files for Sphinx
      #   run: cp -r ${{ env.SPHINX_SOURCE_DIR }}/* ${{ env.BUILDDIR }}/SphinxWorkspace/
      # - name: Install and Setup Target Package for Sphinx
      #  # As we have switched to using `sphinx-autodoc2`, it is no longer necessary to install the package.
      #   run: ${{ env.SPHINX_PACKAGE_SETUP_COMMAND }}
      - name: Download Doxygen XML
        uses: actions/download-artifact@v5
        with:
          name: DoxygenXML
          path: ${{ env.BUILDDIR }}/SphinxWorkspace/xml/
      - name: Install Sphinx and MyST Parser (To Parse MyST Markdown)
        run: pip install -U sphinx myst-parser
      - name: Install the Breathe and Sphinx-Autodoc2 Sphinx Extensions
        run: pip install -U breathe sphinx-autodoc2
      - name: Autogenerate Sphinx Python API Pages
        # Generation of Python API documentation pages is no longer necessary, as this is now done automatically by `sphinx-autodoc2`.
        # run: sphinx-apidoc --implicit-namespaces --separate -o "${{ env.BUILDDIR }}/SphinxWorkspace/pythonAPI" harmonize/
      - name: Autogenerate Breathe-Sphinx C++ API Pages
        run: breathe-apidoc -g class,struct,union,file -o ${{ env.BUILDDIR }}/SphinxWorkspace/cppAPI/ ${{ env.BUILDDIR }}/SphinxWorkspace/xml/
      - name: Run Sphinx JSON Builder
        run: ${{ env.SPHINXBUILD }} -M json "${{ env.BUILDDIR }}/SphinxWorkspace" "${{ env.BUILDDIR }}"
      - name: Upload Generated JSON
        uses: actions/upload-artifact@v4
        with:
          name: SphinxJSON
          path: ${{ env.BUILDDIR }}/json

      # Test Actions for GitHub Pages Upload. These should be disabled in production.
      - name: Run Sphinx HTML Builder
        run: ${{ env.SPHINXBUILD }} -M html "${{ env.BUILDDIR }}/SphinxWorkspace" "${{ env.BUILDDIR }}"
      - name: Upload Generated HTML
        uses: actions/upload-artifact@v4
        with:
          name: SphinxHTML
          path: ${{ env.BUILDDIR }}/html
      # Test Deploy
      - name: Test - Upload Generated HTML, formatted for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: GeneratedDocumentation/html
      - name: Test Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment